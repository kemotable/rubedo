config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[runtimes.enabled]
ruby = "4.0.9"
node = "24.16.0"


[[plugin]]
name = "eslint"
package_file = "package.json"
package_filters = ["eslint", "prettier", "globals"]

[[plugin]]
name = "hadolint"
version = "2.15.1"

[[plugin]]
name = "haml-lint"
package_file = "Gemfile"
package_filters = ["haml_lint"]

[[plugin]]
name = "osv-scanner"
version = "2.3.0"

[[plugin]]
name = "prettier"
package_file = "package.json"
package_filters = ["prettier"]

[[plugin]]
name = "radarlint-iac"
mode = "monitor"
version = "2.0.0"

[[plugin]]
name = "ripgrep"
mode = "comment"
version = "14.1.1"

[[plugin]]
name = "rubocop"
package_file = "Gemfile"
package_filters = ["rubocop"]

[[plugin]]
name = "shellcheck"
version = "0.11.0"

[[plugin]]
name = "trufflehog"
version = "3.97.4"
