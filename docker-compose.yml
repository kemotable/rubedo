services:
  db:
    image: postgres:18
    container_name: rubedo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rubedo
      POSTGRES_PASSWORD: rubedo
      POSTGRES_DB: rubedo_development
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rubedo -d rubedo_development"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
